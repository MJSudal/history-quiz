  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .unit-chip {
      transition: all 0.15s ease;
    }
    .unit-chip.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .option-btn {
      transition: all 0.15s ease;
    }
    .option-btn:hover:not(:disabled) {
      border-color: #3b82f6;
      background-color: #eff6ff;
    }
  </style>

<body class="min-h-screen flex flex-col">

  <!-- 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div>
        <h1 class="text-base sm:text-lg font-bold text-slate-900">중학 역사 핵심 퀴즈</h1>
        <p class="text-xs text-slate-500">I ~ VII 단원 · 총 1577문항 (빈칸 186문항 포함)</p>
      </div>
      <button onclick="openWrongNotes()" class="text-xs sm:text-sm bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition">
        <span>오답노트</span>
        <span id="wrong-count-badge" class="bg-rose-500 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-5 space-y-4">

    <!-- 설정 패널 -->
    <section id="settings-panel" class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 space-y-4">
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-500">출제 단원 (단일·복수 선택 가능)</span>
          <button onclick="toggleAllUnits()" id="toggle-all-btn" class="text-xs font-bold text-blue-600 hover:underline">
            전체 해제
          </button>

    const LEVEL_CLASS = {
      easy: "text-xs font-bold px-2 py-0.5 rounded bg-emerald-50 text-emerald-700",

    // 난이도: 문제에 level("easy"|"normal"|"hard")이 있으면 그 값을 쓰고,
    // 없으면 정답 글자 수로 추정한다(객관식은 짧을수록 쉽고, 단답은 한 단계 더 어렵게 본다).
    function levelOf(q) {
      if (q.level) return q.level;
      const ans = q.type === "mc" ? q.options[q.answer] : q.displayAnswer;
      const n = ans.replace(/\s/g, "").length;
      const [e, m] = q.type === "mc" ? [6, 13] : [4, 7];
      return n <= e ? "easy" : n <= m ? "normal" : "hard";
    }

    function setLevel(level) {
      levelFilter = level;
      document.querySelectorAll(".level-btn").forEach(btn => {
        btn.classList.remove("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
        btn.classList.add("text-slate-600", "font-medium");
      });
      const active = document.getElementById(`level-${level}`);
      active.classList.add("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
      active.classList.remove("text-slate-600", "font-medium");
      startNewQuiz();
    }

    let quizQueue = [];
    let currentIndex = 0;
    let correctCount = 0;
    let isAnswered = false;
    let wrongNotes = [];
    let recentSeenQuestions = new Set();
    let unitStats = {};
    let userAccepted = {};
    const PREFIX = "다음 설명에 해당하는 용어나 내용으로 가장 적절한 것은? ";
    const QUIZ_KEY = STORAGE_PREFIX + "_quiz";
    const OK_KEY = STORAGE_PREFIX + "_ok";
    const $ = id => document.getElementById(id);
    const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    window.addEventListener("DOMContentLoaded", () => {
      loadPersistedState();
      if (!restoreQuiz()) startNewQuiz();
    });

    function loadPersistedState() {
      try {
        const savedWrong = localStorage.getItem(STORAGE_PREFIX + "_wrong");
        if (savedWrong) {
          wrongNotes = JSON.parse(savedWrong) || [];
          updateWrongBadge();
        }
        const savedSeen = localStorage.getItem(STORAGE_PREFIX + "_seen");
        const ok = localStorage.getItem(OK_KEY);
        if (ok) userAccepted = JSON.parse(ok) || {};
        if (savedSeen) {
          recentSeenQuestions = new Set(JSON.parse(savedSeen) || []);
        }
      } catch (e) {}
    }

    function savePersistedState() {
      try {
        localStorage.setItem(STORAGE_PREFIX + "_wrong", JSON.stringify(wrongNotes));
        localStorage.setItem(STORAGE_PREFIX + "_seen", JSON.stringify(Array.from(recentSeenQuestions).slice(-QUESTION_BANK.length)));
      } catch (e) {}
    }

    function toggleUnit(unit) {
      if (selectedUnits.has(unit)) {
        selectedUnits.delete(unit);
      } else {
        selectedUnits.add(unit);
      }
      updateUnitUI();
    }

    function toggleAllUnits() {
      if (selectedUnits.size === ALL_UNITS.length) {
        selectedUnits.clear();
      } else {
        ALL_UNITS.forEach(u => selectedUnits.add(u));
      }
      updateUnitUI();
    }

    function updateUnitUI() {
      document.querySelectorAll(".unit-chip").forEach(btn => {
        const u = btn.getAttribute("data-unit");
        btn.classList.toggle("active", selectedUnits.has(u));
      });
      document.getElementById("toggle-all-btn").textContent = selectedUnits.size === ALL_UNITS.length ? "전체 해제" : "전체 선택";
      document.getElementById("unit-warning").classList.toggle("hidden", selectedUnits.size > 0);
    }

    function setQuestionType(type) {
      questionType = type;
      document.querySelectorAll(".type-btn").forEach(btn => {
        btn.classList.remove("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
        btn.classList.add("text-slate-600", "font-medium");
      });
      const activeBtn = document.getElementById(`type-${type}`);
      activeBtn.classList.add("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
      activeBtn.classList.remove("text-slate-600", "font-medium");
      // 유형을 바꾸면 이미 만들어진 문제 목록이 남지 않도록 즉시 새로 출제
      startNewQuiz();
    }

    function setTargetCount(count) {
      targetCount = count;
      document.querySelectorAll(".count-btn").forEach(btn => {
        const c = Number(btn.getAttribute("data-count"));
        if (c === count) {
          btn.classList.add("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
          btn.classList.remove("text-slate-600", "font-medium");
        } else {
          btn.classList.remove("bg-white", "text-blue-600", "shadow-2xs", "font-bold");
          btn.classList.add("text-slate-600", "font-medium");
        }
      });
      startNewQuiz();
    }

    function checkMcAnswer(selectedIdx) {
      if (isAnswered) return;
      isAnswered = true;

      const item = quizQueue[currentIndex];
      const isCorrect = selectedIdx === item.answer;
      const buttons = document.querySelectorAll("#mc-options button");

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) {
          btn.classList.remove("border-slate-200", "bg-white");
          btn.classList.add("border-emerald-500", "bg-emerald-50", "text-emerald-900", "font-bold");
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.remove("border-slate-200", "bg-white");
          btn.classList.add("border-rose-500", "bg-rose-50", "text-rose-900");
        } else {
          btn.classList.add("opacity-50");
        }
      });

      processResult(isCorrect, item.options[selectedIdx], item.options[item.answer]);
    }

    function normalizeText(str) {
      return str
        .toLowerCase()
        .replace(/[\s·\.\-\(\)\[\],'"`]/g, "")
        .trim();
    }

    function handleNextStep() {
      if (currentIndex + 1 >= quizQueue.length) {
        showFinalResult();
      } else {
        currentIndex++;
        renderQuestion();
      }
    }

    function copyResultReport() {
      const total = quizQueue.length;
      const rate = Math.round((correctCount / total) * 100);
      const unitsStr = Array.from(selectedUnits).join(", ");
      const text = `[${document.title} 결과]\n• 단원: ${unitsStr}\n• 점수: ${total}문제 중 ${correctCount}문제 정답 (${rate}%)\n• 오답 수: ${wrongNotes.length}개`;

      navigator.clipboard.writeText(text).then(() => {
        document.getElementById("copy-toast").classList.remove("hidden");
      });
    }

    function updateWrongBadge() {
      document.getElementById("wrong-count-badge").textContent = wrongNotes.length;
    }

    function closeWrongNotes() {
      document.getElementById("wrong-modal").classList.add("hidden");
    }


    function makeQuestion(base) {
      if (base.type !== "mc") return { ...base };
      const correct = base.options[base.answer];
      const orig = base.options.filter((_, i) => i !== base.answer);
      // 문항에 직접 만든 보기(4개)가 있으면 그대로 사용 (유형이 맞는 오답)
      if (base.options.length >= 4) {
        const own = shuffleArray([...base.options]);
        return { ...base, options: own, answer: own.indexOf(correct) };
      }
      let pool = [...new Set(QUESTION_BANK
        .filter(x => x.type === "mc" && x.unit === base.unit && x.q !== base.q)
        .map(x => x.options[x.answer]))].filter(t => t !== correct);
      if (pool.length < 6) pool = [...new Set(pool.concat(orig))];
      // 같은 단원의 다른 정답들 중 길이가 비슷한 것을 오답으로 사용 (길이로 정답을 찍는 것 방지)
      const near = shuffleArray(pool)
        .sort((a, b) => Math.abs(a.length - correct.length) - Math.abs(b.length - correct.length))
        .slice(0, 6);
      const opts = shuffleArray([correct, ...shuffleArray(near).slice(0, 3)]);
      return { ...base, options: opts, answer: opts.indexOf(correct) };
    }

    function updateLevelCounts() {
      const c = { all: 0, easy: 0, normal: 0, hard: 0 };
      QUESTION_BANK.forEach(i => {
        if (!selectedUnits.has(i.unit)) return;
        if (!(questionType === "mixed" || i.type === questionType)) return;
        c.all++; c[levelOf(i)]++;
      });
      const nm = { all: "전체", easy: "쉬움", normal: "보통", hard: "어려움" };
      Object.keys(nm).forEach(k => { const b = document.getElementById("level-" + k); if (b) b.textContent = `${nm[k]} (${c[k]})`; });
    }

    function startNewQuiz(customItems) {
      updateLevelCounts();
      const custom = Array.isArray(customItems);
      if (!custom && selectedUnits.size === 0) {
        $("unit-warning").classList.remove("hidden");
        return;
      }
      const notice = $("pool-notice");
      notice.textContent = "";
      let finalItems;
      if (custom) {
        finalItems = shuffleArray(customItems);
        notice.textContent = `오답노트에서 ${finalItems.length}문제를 다시 풀어요.`;
      } else {
        const unitsArr = Array.from(selectedUnits);
        const quota = Math.ceil(targetCount / unitsArr.length);
        const buckets = {};
        unitsArr.forEach(u => {
          const strict = QUESTION_BANK.filter(i => i.unit === u && (questionType === "mixed" || i.type === questionType) && (levelFilter === "all" || levelOf(i) === levelFilter));
          let unseen = shuffleArray(strict.filter(q => !recentSeenQuestions.has(q.q)));
          if (unseen.length < quota) {
            strict.forEach(q => recentSeenQuestions.delete(q.q));
            unseen = shuffleArray(strict);
          }
          buckets[u] = unseen;
        });
        const picked = [];
        let added = true;
        while (picked.length < targetCount && added) {
          added = false;
          for (const u of shuffleArray(unitsArr)) {
            if (picked.length >= targetCount) break;
            if (buckets[u].length > 0) { picked.push(buckets[u].shift()); added = true; }
          }
        }
        const lvName = { easy: "쉬움", normal: "보통", hard: "어려움" };
        if (picked.length < targetCount) notice.textContent = levelFilter === "all"
          ? `선택한 조건의 문제가 ${picked.length}개뿐이라 ${picked.length}문제로 출제했어요.`
          : `'${lvName[levelFilter]}' 문제가 ${picked.length}개뿐이라 ${picked.length}문제만 출제했어요. 단원을 더 선택하거나 난이도를 바꾸면 문제 수가 늘어나요.`;
        if (picked.length === 0) { notice.textContent = "선택한 조건에 맞는 문제가 없어요."; return; }
        finalItems = shuffleArray(picked);
        finalItems.forEach(i => recentSeenQuestions.add(i.q));
        savePersistedState();
      }
      quizQueue = finalItems.map(makeQuestion);
      currentIndex = 0;
      correctCount = 0;
      unitStats = {};
      showQuizUI();
      renderQuestion();
    }

    function showQuizUI() {
      $("result-screen").classList.add("hidden");
      $("progress-section").classList.remove("hidden");
      $("quiz-card").classList.remove("hidden");
    }

    function persistQuiz() {
      try { localStorage.setItem(QUIZ_KEY, JSON.stringify({ quizQueue, currentIndex, correctCount, unitStats })); } catch (e) {}
    }

    function restoreQuiz() {
      try {
        const st = JSON.parse(localStorage.getItem(QUIZ_KEY) || "null");
        if (!st || !Array.isArray(st.quizQueue) || !st.quizQueue[st.currentIndex]) return false;
        quizQueue = st.quizQueue; currentIndex = st.currentIndex;
        correctCount = st.correctCount || 0; unitStats = st.unitStats || {};
        showQuizUI();
        renderQuestion();
        return true;
      } catch (e) { return false; }
    }

    function renderQuestion() {
      isAnswered = false;
      const item = quizQueue[currentIndex];
      if (item.type === "mc" && item.options.length >= 2) {
        // 문제를 보여줄 때마다 보기 순서를 새로 섞는다
        const correctText = item.options[item.answer];
        const sh = shuffleArray(item.options);
        item.options = sh; item.answer = sh.indexOf(correctText);
      }
      const total = quizQueue.length;
      const num = currentIndex + 1;
      $("progress-label").textContent = `${num} / ${total}`;
      $("current-unit-tag").textContent = item.unitName;
      $("score-correct").textContent = correctCount;
      $("progress-bar").style.width = `${(num / total) * 100}%`;

      const badge = $("q-type-badge");
      const isMc = item.type === "mc";
      badge.textContent = isMc ? "객관식" : (item.blank ? "빈칸" : "단답");
      badge.className = "text-xs font-bold px-2 py-0.5 rounded " + (isMc ? "bg-blue-50 text-blue-700" : "bg-amber-50 text-amber-700");

      const lv = $("q-level");
      lv.textContent = LEVEL_LABEL[levelOf(item)];
      lv.className = LEVEL_CLASS[levelOf(item)];
      let q = item.q, desc = "";
      if (q.startsWith(PREFIX)) { desc = q.slice(PREFIX.length); q = PREFIX.trim(); }
      else if (q.includes("\n")) { const k = q.indexOf("\n"); desc = q.slice(k + 1); q = q.slice(0, k); }
      $("q-hint").textContent = "";
      $("question-text").textContent = `${num}. ${q}`;
      const dEl = $("q-desc");
      dEl.textContent = desc;
      dEl.classList.toggle("hidden", !desc);
      $("feedback-box").classList.add("hidden");
      $("next-action-area").classList.add("hidden");
      $("override-btn").classList.add("hidden");

      const mcArea = $("mc-options"), saArea = $("sa-area");
      if (isMc) {
        mcArea.classList.remove("hidden");
        saArea.classList.add("hidden");
        mcArea.innerHTML = "";
        const labels = ["①", "②", "③", "④"];
        item.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn w-full text-left p-3.5 rounded-xl border border-slate-200 bg-white font-medium text-sm text-slate-800 flex items-center gap-2.5";
          btn.innerHTML = `<span class="font-bold text-slate-500">${labels[idx]}</span><span>${esc(opt)}</span>`;
          btn.onclick = () => checkMcAnswer(idx);
          mcArea.appendChild(btn);
        });
      } else {
        mcArea.classList.add("hidden");
        saArea.classList.remove("hidden");
        const input = $("sa-input");
        input.value = "";
        input.style.borderColor = ""; input.style.backgroundColor = ""; input.style.color = "";
        input.disabled = false;
        $("sa-submit-btn").disabled = false;
        setTimeout(() => input.focus(), 50);
      }
      persistQuiz();
    }

    function isSaCorrect(raw, item) {
      if (((userAccepted[item.q]) || []).includes(normalizeText(raw))) return true;
      const u0 = normalizeText(raw);
      const cands = [u0, u0.replace(/(입니다|이에요|예요|이다|임|다|요)$/, "")].filter(Boolean);
      const accepted = item.accepted.map(normalizeText);
      if (item.blank) return cands.some(u => accepted.some(n => u === n));
      return cands.some(u => accepted.some(n =>
        u === n ||
        (n.length >= 2 && u.includes(n) && u.length <= n.length + 3) ||
        (u.length >= 3 && n.includes(u) && u.length >= n.length * 0.6)
      ));
    }

    function submitShortAnswer() {
      if (isAnswered) return;
      const input = $("sa-input");
      const rawUser = input.value.trim();
      if (!rawUser) { input.focus(); return; }
      isAnswered = true;
      input.disabled = true;
      $("sa-submit-btn").disabled = true;
      const item = quizQueue[currentIndex];
      const ok = isSaCorrect(rawUser, item);
      input.style.borderColor = ok ? "#10b981" : "#f43f5e";
      input.style.backgroundColor = ok ? "#ecfdf5" : "#fff1f2";
      input.style.color = ok ? "#065f46" : "#9f1239";
      processResult(ok, rawUser, item.displayAnswer);
      try { $("feedback-box").scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {}
    }

    function paintFeedback(isCorrect, correctAnsText) {
      const fbBox = $("feedback-box"), t = $("feedback-title"), a = $("feedback-answer");
      fbBox.classList.remove("hidden", "bg-emerald-50", "border-emerald-200", "bg-rose-50", "border-rose-200");
      // 빌드된 Tailwind가 인식하도록 클래스 이름을 문자열 그대로 둔다
      fbBox.classList.add(...(isCorrect ? ["bg-emerald-50", "border-emerald-200"] : ["bg-rose-50", "border-rose-200"]));
      t.textContent = isCorrect ? "✓ 정답입니다" : "✕ 오답입니다";
      t.className = isCorrect ? "font-bold text-base text-emerald-700" : "font-bold text-base text-rose-700";
      a.textContent = `정답: ${correctAnsText}`;
      a.className = "text-xs font-bold px-2 py-0.5 rounded " + (isCorrect ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800");
    }

    function processResult(isCorrect, userAnsText, correctAnsText) {
      const item = quizQueue[currentIndex];
      const st = unitStats[item.unitName] || (unitStats[item.unitName] = { c: 0, t: 0 });
      st.t++;
      wrongNotes = wrongNotes.filter(w => w.q !== item.q);
      if (isCorrect) {
        correctCount++;
        st.c++;
      } else {
        wrongNotes.push({ unitName: item.unitName, q: item.q, userAns: userAnsText, correctAns: correctAnsText, explanation: cleanExp(item) || (item.q.split("\n")[0] + " → " + correctAnsText), tip: item.tip });
      }
      updateWrongBadge();
      savePersistedState();
      $("score-correct").textContent = correctCount;
      paintFeedback(isCorrect, correctAnsText);
      toastResult(isCorrect, isCorrect ? "✓ 정답입니다!" : "✕ 오답입니다");
      $("override-btn").classList.toggle("hidden", isCorrect || item.type !== "sa");
      const ex = cleanExp(item); $("feedback-explanation").textContent = ex; $("feedback-explanation").classList.toggle("hidden", !ex);
      const showTip = item.tip && !(item.explanation||"").includes(item.tip);
      $("feedback-tip-row").classList.toggle("hidden", !showTip);
      $("feedback-tip").textContent = item.tip;

      $("next-action-area").classList.remove("hidden");
      const nextBtn = $("next-btn");
      const last = currentIndex + 1 >= quizQueue.length;
      nextBtn.textContent = last ? "결과 보기" : "다음 문제";
      nextBtn.classList.toggle("bg-emerald-600", last);
      nextBtn.classList.toggle("hover:bg-emerald-700", last);
      nextBtn.classList.toggle("bg-blue-600", !last);
      nextBtn.classList.toggle("hover:bg-blue-700", !last);
      if (item.type === "mc") nextBtn.focus(); else setTimeout(() => { if (isAnswered) nextBtn.focus(); }, 400);
    }

    function overrideCorrect() {
      const item = quizQueue[currentIndex];
      const wrong = wrongNotes.find(w => w.q === item.q);
      if (!wrong) return;
      (userAccepted[item.q] = userAccepted[item.q] || []).push(normalizeText(wrong.userAns));
      try { localStorage.setItem(OK_KEY, JSON.stringify(userAccepted)); } catch (e) {}
      wrongNotes = wrongNotes.filter(w => w.q !== item.q);
      correctCount++;
      unitStats[item.unitName].c++;
      updateWrongBadge();
      savePersistedState();
      $("score-correct").textContent = correctCount;
      paintFeedback(true, item.displayAnswer);
      toastResult(true, "✓ 정답으로 인정했습니다");
      $("override-btn").classList.add("hidden");
    }

    function finishEarly() {
      const answered = currentIndex + (isAnswered ? 1 : 0);
      if (answered === 0 && !confirm("아직 푼 문제가 없어요. 그래도 그만 풀까요?")) return;
      quizQueue = quizQueue.slice(0, answered);
      showFinalResult();
    }

    function showFinalResult() {
      try { localStorage.removeItem(QUIZ_KEY); } catch (e) {}
      $("quiz-card").classList.add("hidden");
      $("progress-section").classList.add("hidden");
      $("result-screen").classList.remove("hidden");
      $("copy-toast").classList.add("hidden");
      const total = quizQueue.length;
      const rate = total ? Math.round((correctCount / total) * 100) : 0;
      $("res-total").textContent = `${total}문제`;
      $("res-correct").textContent = `${correctCount}개`;
      $("res-rate").textContent = `${rate}%`;
      $("res-units").innerHTML = Object.entries(unitStats).map(([n, s]) =>
        `<div class="flex justify-between bg-slate-50 rounded-lg px-3 py-1.5"><span>${esc(n)}</span><span class="font-bold">${s.c}/${s.t} (${Math.round(s.c / s.t * 100)}%)</span></div>`).join("");
    }

    function cleanExp(item) {
      let e = (item.explanation || "").trim();
      const m = e.match(/^정답은\s*'([\s\S]*?)'입니다\.?\s*([\s\S]*)$/);
      if (!m) return e;
      const ans = m[1], rest = m[2].trim();
      const nz = x => x.replace(/[\s.,·'"“”‘’()（）\-–—:：]/g, "");
      const a = nz(ans), r = nz(rest);
      if (!r || r === a || a.includes(r) || (r.includes(a) && r.length <= a.length + 2)) return blankFill(item);
      return rest;
    }

    function blankFill(item) {
      if (!item.blank) return "";
      const k = item.q.indexOf("\n");
      if (k < 0) return "";
      const ans = item.displayAnswer || (item.accepted && item.accepted[0]) || "";
      const sent = item.q.slice(k + 1).replace(/\([\s\u3000]*\)/, ans);
      return "완성된 문장: " + sent;
    }

    function toastResult(ok, msg) {
      let t = document.getElementById("result-toast");
      if (!t) {
        t = document.createElement("div");
        t.id = "result-toast";
        t.style.cssText = "position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:90;padding:12px 26px;border-radius:999px;font-weight:800;font-size:18px;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none;transition:opacity .25s;color:#fff";
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.background = ok ? "#059669" : "#e11d48";
      t.style.opacity = "1";
      clearTimeout(t._h);
      t._h = setTimeout(() => { t.style.opacity = "0"; }, 1400);
    }

    function retryWrong() {
      const items = wrongNotes.map(w => QUESTION_BANK.find(b => b.q === w.q)).filter(Boolean);
      if (items.length === 0) { alert("다시 풀 오답이 없어요."); return; }
      const byUnit = {};
      items.forEach(it => { (byUnit[it.unitName] = byUnit[it.unitName] || []).push(it); });
      const names = Object.keys(byUnit);
      let box = document.getElementById("retry-modal");
      if (box) box.remove();
      box = document.createElement("div");
      box.id = "retry-modal";
      box.style.cssText = "position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px";
      box.innerHTML = `<div style="background:#fff;border-radius:16px;max-width:440px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden">
        <div style="padding:16px 20px;border-bottom:1px solid #e2e8f0;font-weight:800;font-size:16px;color:#0f172a">다시 풀 범위 선택</div>
        <div style="padding:12px 20px;overflow-y:auto;flex:1;font-size:14px">
          <label style="display:flex;gap:8px;align-items:center;padding:8px 0;font-weight:700;border-bottom:1px solid #f1f5f9"><input type="checkbox" id="retry-all" checked> 전체 선택 <span style="color:#64748b;font-weight:500">(${items.length}문제)</span></label>
          ${names.map((n,i)=>`<label style="display:flex;gap:8px;align-items:center;padding:8px 0"><input type="checkbox" class="retry-unit" data-i="${i}" checked><span style="flex:1">${esc(n)}</span><span style="color:#64748b">${byUnit[n].length}문제</span></label>`).join("")}
        </div>
        <div style="padding:12px 20px;border-top:1px solid #e2e8f0;display:flex;gap:8px;justify-content:flex-end">
          <button type="button" id="retry-cancel" style="padding:8px 14px;border-radius:8px;background:#f1f5f9;font-weight:700;font-size:13px">취소</button>
          <button type="button" id="retry-go" style="padding:8px 16px;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:13px">선택한 범위로 풀기</button>
        </div></div>`;
      document.body.appendChild(box);
      const units = () => Array.from(box.querySelectorAll(".retry-unit"));
      box.querySelector("#retry-all").onchange = e => units().forEach(c => c.checked = e.target.checked);
      units().forEach(c => c.onchange = () => { box.querySelector("#retry-all").checked = units().every(x => x.checked); });
      box.querySelector("#retry-cancel").onclick = () => box.remove();
      box.onclick = e => { if (e.target === box) box.remove(); };
      box.querySelector("#retry-go").onclick = () => {
        const picked = [];
        units().forEach(c => { if (c.checked) picked.push(...byUnit[names[Number(c.dataset.i)]]); });
        if (!picked.length) { alert("범위를 하나 이상 선택해 주세요."); return; }
        box.remove();
        closeWrongNotes();
        startNewQuiz(picked);
      };
    }

    function openWrongNotes() {
      const list = $("wrong-list");
      list.innerHTML = wrongNotes.length === 0
        ? `<p class="text-slate-400 text-center py-8">틀린 문제가 없습니다.</p>`
        : wrongNotes.map((w, i) => `
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-1.5">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-blue-600">${esc(w.unitName)}</span>
              <span class="text-slate-400">#${i + 1}</span>
            </div>
            <p class="font-bold text-slate-900">${esc(w.q)}</p>
            <div class="flex flex-wrap gap-2 text-xs">
              <span class="bg-rose-100 text-rose-700 px-2 py-0.5 rounded">입력: ${esc(w.userAns)}</span>
              <span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-bold">정답: ${esc(w.correctAns)}</span>
            </div>
            ${w.explanation ? `<p class="text-xs text-slate-600 leading-relaxed pt-1">${esc(w.explanation)}</p>` : ""}
          </div>`).join("");
      $("wrong-modal").classList.remove("hidden");
    }

    function clearWrongNotes() {
      wrongNotes = [];
      updateWrongBadge();
      savePersistedState();
      openWrongNotes();
    }

    document.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT" || isAnswered || $("quiz-card").classList.contains("hidden")) return;
      const k = Number(e.key);
      const item = quizQueue[currentIndex];
      if (item && item.type === "mc" && k >= 1 && k <= 4) checkMcAnswer(k - 1);
    });

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
  </script>
</body>
